
services:
  orders:
    build: ./orders-java
    ports:
      - "8080:8080"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
      - TAX_SERVICE_URL=http://tax:4567
      - APP_ENV=production
    depends_on:
      - redpanda
      - tax
    networks:
      - internal

  orders-test-base:
    build:
      context: .
      dockerfile: orders-java/Dockerfile.test

  orders-contract-tests:
    extends: orders-test-base
    command: gradle contractTest --no-daemon
    environment:
      - PACT_DO_NOT_TRACK=true
    volumes:
      - ./pacts:/pacts

  redpanda:
    image: redpandadata/redpanda:v25.2.4
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1024M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      # Kafka listener and advertised address for Docker network
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092
      - --rpc-addr
      - 0.0.0.0:33145
      - --advertise-rpc-addr
      - redpanda:33145
    expose:
      - "9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      start_period: 15s
    networks:
      - internal

  tax:
    build: ./tax-ruby
    expose:
      - "4567"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4567/health"]
      interval: 10s
      timeout: 10s
      start_period: 15s
    networks:
      - internal

networks:
  internal:
    driver: bridge
