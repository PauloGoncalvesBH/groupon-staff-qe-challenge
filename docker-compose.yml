
services:
  orders:
    build: ./orders-java
    ports:
      - "8080:8080"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
      - TAX_SERVICE_URL=http://tax:4567
      - APP_ENV=production
    depends_on:
      - redpanda
      - tax
    networks:
      - internal

  orders-test-base:
    build:
      context: .
      dockerfile: orders-java/Dockerfile.test
    volumes:
      - ./orders-java/src/test:/workspace/src/test:ro

  orders-contract-tests:
    extends: orders-test-base
    command: gradle contractTest --no-daemon
    environment:
      - PACT_DO_NOT_TRACK=true
    volumes:
      - ./pacts:/pacts:rw

  orders-unit-tests:
    extends: orders-test-base
    command: gradle unitTest --no-daemon

  orders-integration-tests:
    extends: orders-test-base
    command: gradle integrationTest --no-daemon
    environment:
      - TESTCONTAINERS_HOST_OVERRIDE=${TESTCONTAINERS_HOST_OVERRIDE:-host.docker.internal}
      - TESTCONTAINERS_RYUK_CONTAINER_PRIVILEGED=true
      - TESTCONTAINERS_RYUK_DISABLED=true
    privileged: true
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./orders-java:/workspace:rw
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

  redpanda:
    image: redpandadata/redpanda:v25.2.4
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1024M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      # Kafka listener and advertised address for Docker network
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092
      - --rpc-addr
      - 0.0.0.0:33145
      - --advertise-rpc-addr
      - redpanda:33145
    expose:
      - "9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      start_period: 15s
    networks:
      - internal

  tax:
    build: ./tax-ruby
    expose:
      - "4567"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4567/health"]
      interval: 10s
      timeout: 10s
      start_period: 15s
    networks:
      - internal

  tax-unit-tests:
    build: ./tax-ruby
    command: bundle exec rspec --options spec/.rspec spec/unit
    working_dir: /app
    volumes:
      - ./tax-ruby/spec:/app/spec:ro

  tax-contract-tests:
    build: ./tax-ruby
    command: bundle exec rake pact:verify
    working_dir: /app
    environment:
      - VERBOSE=true
      - PACT_DO_NOT_TRACK=true
      - PACT_FILE=/app/pacts/orders-tax.json
    depends_on:
      tax:
        condition: service_healthy
    volumes:
      - ./tax-ruby/spec:/app/spec:ro
      - ./pacts:/app/pacts:ro

networks:
  internal:
    driver: bridge
