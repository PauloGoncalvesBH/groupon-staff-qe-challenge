plugins {
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'java'
}

repositories {
    mavenCentral()
}

group = 'com.groupon'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'au.com.dius.pact.consumer:junit5:4.6.15'
    testImplementation 'org.testcontainers:junit-jupiter:1.19.7'
    testImplementation 'org.testcontainers:kafka:1.19.7'
    testImplementation 'com.github.tomakehurst:wiremock-jre8-standalone:2.35.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed', 'standardOut', 'standardError'
        exceptionFormat 'full'
        showStandardStreams = true
    }
}

tasks.register('unitTest', Test) {
    description = 'Runs unit tests only'
    group = 'verification'
    useJUnitPlatform {
        includeTags 'unit'
    }
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = false
    }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
}

tasks.register('contractTest', Test) {
    description = 'Runs contract tests only'
    group = 'verification'
    useJUnitPlatform {
        includeTags 'contract'
    }
    systemProperty 'pact.rootDir', '/pacts'
    systemProperty 'pact.writer.overwrite', 'true'
    systemProperty 'pact.logLevel', 'DEBUG'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    // Always run to regenerate pact files (avoid Gradle up-to-date skipping)
    outputs.upToDateWhen { false }
}

tasks.register('integrationTest', Test) {
    description = 'Runs integration tests only'
    group = 'verification'
    useJUnitPlatform {
        includeTags 'integration'
    }
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = false
    }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    outputs.upToDateWhen { false }
}
