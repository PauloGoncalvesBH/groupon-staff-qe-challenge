plugins {
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'java'
}

repositories {
    mavenCentral()
}

group = 'com.groupon'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'au.com.dius.pact.consumer:junit5:4.6.15'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed', 'standardOut', 'standardError'
        exceptionFormat 'full'
        showStandardStreams = true
    }
}

tasks.named('test') {
    systemProperty 'pact.rootDir', new File(project.rootProject.projectDir.parentFile, 'pacts').absolutePath
    systemProperty 'pact.writer.overwrite', 'true'
}

tasks.register('contractTest', Test) {
    description = 'Runs contract tests only'
    group = 'verification'
    useJUnitPlatform {
        includeTags 'contract'
    }
    systemProperty 'pact.rootDir', new File(project.rootProject.projectDir.parentFile, 'pacts').absolutePath
    systemProperty 'pact.writer.overwrite', 'true'
    // systemProperty 'pact.logLevel', 'DEBUG'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    // Always run to regenerate pact files (avoid Gradle up-to-date skipping)
    outputs.upToDateWhen { false }
}
